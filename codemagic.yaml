workflows:
  ios-unsigned:
    name: iOS unsigned IPA (Sideloadly용)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build unsigned iOS
        script: |
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.project-box.life --dart-define=CHAT_API_BASE_URL=https://chat.project-box.life --dart-define=CHAT_LLM_ENABLED=1 --dart-define=CHAT_LLM_PROVIDER=groq
      - name: Package IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr DaeByeonBox-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/DaeByeonBox-unsigned.ipa
